; LILYGO T-Deck Pro (ESP32-S3): the Wi-Fi of the chip itself - node /dev/wlan0 (named after the interface), interface "wlan0".
; The antenna is the one of the board; nothing is wired. The networks are set from the shell: wifi connect SSID PASSWORD.
[wifi]
driver_name=dmespwifi
driver_order=22
interface=wlan
; The log of the libraries (a ring of 4 kB in the RAM, its address is in RTC_CNTL_STORE5): 0 errors, 1 warnings, 2 info, 3 debug, 4 verbose
log_level=1
