; ESP32-S3-LCD-2.8 (ESP32-S3FN16R8): the Wi-Fi of the chip itself - node /dev/dmespwifi0 (numbered by dmdevfs),
; interface "wlan0": the friendly name below and the number of the node (the next free one when the name is taken).
; The antenna is the one of the board; nothing is wired. The radio is started by this driver (the libraries of Espressif, the image
; in the flash from 0x020000 - see the README), the networks are set from the shell: wifi -d /dev/dmespwifi0 connect SSID PASSWORD, or wifi save SSID and
; the connection of the saved network by wifid.
[wifi]
driver_name=dmespwifi
driver_order=22
interface=wlan
; The log of the libraries (a ring of 4 kB in the RAM, its address is in RTC_CNTL_STORE5): 0 errors, 1 warnings, 2 info, 3 debug, 4 verbose
log_level=1
