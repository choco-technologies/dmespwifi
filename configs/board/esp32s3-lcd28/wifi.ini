; ESP32-S3-LCD-2.8 (ESP32-S3FN16R8): the Wi-Fi of the chip itself - node /dev/wlan0, interface "wlan0".
; The antenna is the one of the board; nothing is wired. The radio is started by this driver (the libraries of Espressif, the image
; in the flash from 0x020000 - see the README), the networks are set from the shell: wifi connect SSID PASSWORD, or wifi save SSID and
; the connection of the saved network by wifid.
[wlan0]
driver_name=dmespwifi
driver_order=22
interface=wlan0
; The log of the libraries (a ring of 4 kB in the RAM, its address is in RTC_CNTL_STORE5): 0 errors, 1 warnings, 2 info, 3 debug, 4 verbose
log_level=1
thread_priority=4
