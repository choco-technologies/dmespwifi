name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image of the Espressif libraries (the package carries it): the sources and the libraries of ESP-IDF are fetched by the script
      - name: Build the image of the Wi-Fi libraries
        run: |
          image/build.sh
          test -f image/dmespwifi_image.bin

      - name: Build dmespwifi
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmespwifi.dmf
          test -f build/dmf/dmespwifi_version.txt
          test -f build/dmf/test_dmespwifi.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmespwifi-local.dmd -y
          dmod_loader build/dmf/test_dmespwifi.dmf
