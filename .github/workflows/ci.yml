name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure dmespwifi
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE

      # The library of the radio (the package carries it): the sources and the libraries of ESP-IDF are fetched by the script; the glue
      # needs the headers of dmod, which the configure step fetched
      - name: Build the library of the radio
        run: |
          DMOD_INC="-I$PWD/build/_deps/dmod-src/inc -I$PWD/build/_deps/dmod-build" image/build.sh
          test -f image/libdmespwifi.a

      - name: Build dmespwifi
        run: |
          cd build
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmespwifi.dmf
          test -f build/dmf/dmespwifi_version.txt
          test -f build/dmf/test_dmespwifi.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmespwifi-local.dmd -y
          dmod_loader build/dmf/test_dmespwifi.dmf
